name: CI

# Quality gate do Cartório System.
#
# Executa exatamente os mesmos comandos documentados em CLAUDE.md § 5 e em
# docs/operations/how_to_run.md, para que "verde no CI" e "verde na máquina"
# signifiquem a mesma coisa.
#
# Escopo deliberadamente mínimo (sprint CARTORIO-SYSTEM-ENGINEERING-STABILIZATION-1):
# formatação, lint, testes e migrations. Ferramentas de segurança
# (bandit, pip-audit, gitleaks) e tipagem (mypy) NÃO entram aqui — elas exigem
# decisão e sprint próprias, conforme TD-10.
#
# O job `postgres-gate` (CARTORIO-OPS-1) é focado e separado: o gate SQLite acima
# continua exatamente como estava.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-gate:
    name: Formatação, lint, testes e migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          # O projeto não tem requirements.txt; sem esta linha o cache do
          # setup-python procuraria por um e falharia.
          cache-dependency-path: pyproject.toml

      # Instala a partir do contrato declarado no pyproject.toml — nada de
      # requirements paralelos. Se uma dependência de runtime não estiver
      # declarada (como PyYAML não estava até a TD-23), o gate quebra aqui.
      - name: Instalar o projeto (runtime + dev)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Formatação (ruff format)
        run: python -m ruff format --check .

      - name: Lint (ruff check)
        run: python -m ruff check .

      - name: Testes (pytest)
        run: python -m pytest -q

      # Gate hermético de migrations: banco SQLite temporário criado do zero
      # nesta execução. O banco de desenvolvimento `cartorio.db` é gitignorado
      # e portanto nunca chega ao runner — a verificação abaixo torna isso
      # explícito em vez de presumido.
      - name: Migrations (banco temporário, nunca cartorio.db)
        env:
          DATABASE_URL: sqlite:///./ci_alembic_check.db
        run: |
          test ! -f cartorio.db || { echo "cartorio.db presente no runner — abortando"; exit 1; }
          python -m alembic upgrade head
          python -m alembic current
          python -m alembic heads
          python -m alembic check
          rm -f ci_alembic_check.db

  # Gate PostgreSQL de bancada (CARTORIO-OPS-1). O mesmo comando roda localmente —
  # ver docs/operations/ops_verifier_runbook.md. Reprova se qualquer prova obrigatória
  # for pulada; nenhum segredo sai do job (senhas geradas morrem com o runner).
  postgres-gate:
    name: "PostgreSQL 18 — suíte do PR #5, verificador e prova de recuperação"
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # Repositório oficial PGDG (pacotes assinados), sem cluster padrão: o gate cria
      # os seus em diretórios próprios, só em loopback e com credencial gerada.
      - name: Instalar PostgreSQL 18 (PGDG, sem cluster padrão)
        run: |
          sudo install -d /etc/postgresql-common/createcluster.d
          echo "create_main_cluster = false" | sudo tee /etc/postgresql-common/createcluster.d/99-cartorio-ops.conf
          sudo apt-get update -q
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-18
          /usr/lib/postgresql/18/bin/postgres --version

      - name: Instalar o projeto (runtime + dev + postgres)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,postgres]"

      # Prova obrigatória: com a variável abaixo o teste falha (não pula) se a
      # ferramenta faltar, e -rA deixa o PASSED nominal no log.
      - name: Unidades do verificador (systemd-analyze verify)
        env:
          CARTORIO_OPS_REQUIRE_SYSTEMD_ANALYZE: "1"
        run: |
          systemd-analyze --version | head -n 1
          python -m pytest -p no:cacheprovider -rA tests/test_ops_units.py

      # Área privada do ensaio e destino da exportação sob umask 022. Num runner Linux
      # estes testes não têm como ser pulados; -rA deixa o PASSED nominal no log.
      - name: Área privada do ensaio e destino da exportação (umask 022)
        run: |
          python -m pytest -p no:cacheprovider -rA tests/test_ops_drill.py \
            -k "umask_022 or private_from_creation or stays_private or export_destination"

      # O gate só imprime o que conferiu e só grava em --publish-dir (nova a cada run) o
      # que pode sair: relatórios sem credencial, listados num manifesto de liberação.
      - name: "Gate PostgreSQL de bancada (PR #5 + verificador + prova de recuperação)"
        run: |
          python scripts/ops/pg_gate.py \
            --pg-bin /usr/lib/postgresql/18/bin \
            --work-root "$RUNNER_TEMP" \
            --publish-dir "$RUNNER_TEMP/pg-gate-liberados"

      # O artefato é SÓ o que o gate liberou: os arquivos do manifesto, conferidos de novo
      # (nome, SHA-256 e varredura). Nada do diretório temporário entra por glob; sem
      # manifesto, ou com divergência, nada é publicado.
      - name: Selecionar os relatórios liberados pelo gate
        id: liberados
        if: always()
        run: |
          python scripts/ops/pg_gate.py \
            --list-released "$RUNNER_TEMP/pg-gate-liberados" \
            --github-output "$GITHUB_OUTPUT"

      - name: Publicar relatórios liberados (sem segredos)
        if: always() && steps.liberados.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: pg-gate-reports
          # Gate, prova sintética, modo cópia e recusa do banco divergente.
          path: ${{ steps.liberados.outputs.paths }}
          if-no-files-found: error

      # OPS-2 (piloto fora do host), depois da publicação da OPS-1, que fica intocada.
      # Os 13 testes POSIX com nome no log e a prova ponta a ponta: exportar → copiar →
      # retirar a origem e o sinal → observar → restaurar só do destino → ler pela API →
      # limpar. Teste pulado ou prova faltando reprova; só sai um resumo sintético
      # conferido contra credencial, e a área do passo é removida no fim.
      - name: "OPS-2: cópia fora do host (POSIX + ponta a ponta)"
        run: |
          python scripts/ops/offsite_gate.py \
            --pg-bin /usr/lib/postgresql/18/bin \
            --work-root "$RUNNER_TEMP"
